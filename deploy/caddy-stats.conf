# systemd drop-in for Caddy: reads the stats password hash from a server-only
# file, so it never sits in this public repo. Installed to
# /etc/systemd/system/caddy.service.d/stats.conf by deploy/setup-server.sh.
#
# /etc/caddy/stats.env (root-only, optional; without it /stats stays locked):
#   STATS_USER=pascal
#   STATS_PASS_HASH='$2a$14$...'      <- output of `caddy hash-password`, in single quotes

[Service]
EnvironmentFile=-/etc/caddy/stats.env
